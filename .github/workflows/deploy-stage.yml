name: Deploy stage

# Triggers:
#   - push to main that touches backend/, aws/, or this workflow
#   - manual workflow_dispatch (with optional image tag override for redeploy/rollback)
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "aws/**"
      - ".github/workflows/deploy-stage.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: short SHA of HEAD). Use a previous SHA to roll back."
        required: false
        type: string

permissions:
  id-token: write  # required for AWS OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: reservation/stage/api
  ECS_CLUSTER: ecs-reservation-stage
  API_SERVICE: svc-ecs-reservation-stage-api
  WORKER_SERVICE: svc-ecs-reservation-stage-celery-worker
  BEAT_SERVICE: svc-ecs-reservation-stage-celery-beat
  TF_VERSION: "1.8.5"
  TG_VERSION: "0.55.21"

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reservation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          POSTGRES_DB: reservation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          DJANGO_SECRET_KEY: ci-only-do-not-reuse
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "*"
        run: python manage.py test --settings=config.test_settings --verbosity=2

  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    environment: staging   # OIDC sub claim becomes ":environment:staging"
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_SHA::12}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push
        if: github.event.inputs.image_tag == ''  # skip build if we're redeploying an existing image
        working-directory: backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker build --pull -t "$IMAGE" .
          docker tag "$IMAGE" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "Pushed $IMAGE"

      - name: Confirm rollback image exists
        if: github.event.inputs.image_tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" >/dev/null
          echo "Found existing image with tag $TAG — rollback proceeding."

  migrate:
    name: Run Django migrations (one-off ECS task)
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register & run migrate task
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail

          # 1. Clone the API service's current task definition as a template.
          CURRENT_TD_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$API_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          echo "Cloning task def: $CURRENT_TD_ARN"

          aws ecs describe-task-definition --task-definition "$CURRENT_TD_ARN" \
            --query 'taskDefinition' --output json > td.json

          # 2. Build the migrate task def: same env/secrets/roles, swap image + command.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          NEW_IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"
          API_CONTAINER_NAME=$(jq -r '.containerDefinitions[0].name' td.json)

          jq --arg image "$NEW_IMAGE" --arg name "$API_CONTAINER_NAME" '
            .family = "migrate-reservation-stage" |
            .containerDefinitions = [
              (.containerDefinitions[] | select(.name == $name) | .image = $image
                | .command = ["sh","-c","python manage.py migrate --noinput && python manage.py seed_categories"]
                | .entryPoint = null
                | .portMappings = [])
            ] |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' td.json > migrate-td.json

          MIGRATE_TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://migrate-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered: $MIGRATE_TD_ARN"

          # 3. Use the API service's network config so the task lands in the same subnets/SGs.
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$API_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATE_TD_ARN" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --started-by "gha-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Started: $TASK_ARN"

          # 4. Wait, then assert success.
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration task failed with exit code $EXIT_CODE"
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text
            TASK_ID="${TASK_ARN##*/}"
            LOG_PREFIX=$(jq -r '.containerDefinitions[0].logConfiguration.options["awslogs-stream-prefix"] // empty' td.json)
            LOG_GROUP=$(jq -r '.containerDefinitions[0].logConfiguration.options["awslogs-group"] // empty' td.json)
            if [ -n "$LOG_GROUP" ]; then
              echo "Last 50 log lines:"
              aws logs tail "$LOG_GROUP" --since 10m --filter-pattern "$TASK_ID" | tail -50 || true
            fi
            exit 1
          fi
          echo "Migrations completed successfully."

  deploy:
    name: Roll out ECS services
    needs: [build, migrate]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt apply (ecs layer)
        working-directory: aws/accounts/stage/ap-southeast-1/ecs
        env:
          API_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt apply -auto-approve

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$API_SERVICE" "$WORKER_SERVICE" "$BEAT_SERVICE"
          echo "All ECS services are stable on tag ${{ needs.build.outputs.image_tag }}"

      - name: Summary
        run: |
          {
            echo "### Deploy summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image tag | \`${{ needs.build.outputs.image_tag }}\` |"
            echo "| Commit | [${GITHUB_SHA::12}](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |"
            echo "| Cluster | $ECS_CLUSTER |"
            echo "| Region | $AWS_REGION |"
          } >> "$GITHUB_STEP_SUMMARY"
