name: Backend deploy

# Branch → environment mapping:
#   staging → staging
#   main    → prod
#
# Triggers:
#   - push to staging or main that touches backend/, aws/, or this workflow
#   - manual workflow_dispatch (with optional image tag override for redeploy/rollback,
#     and a forced environment so you can deploy prod from a non-main branch in emergencies)
on:
  push:
    branches: [staging, main]
    paths:
      - "backend/**"
      - "aws/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Force deploy to a specific environment"
        required: true
        type: choice
        options: [staging, prod]
      image_tag:
        description: "Image tag to deploy (default: short SHA of HEAD). Use a previous SHA to roll back."
        required: false
        type: string

permissions:
  id-token: write  # required for AWS OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.8.5"
  TG_VERSION: "0.55.21"

jobs:
  # The test job is environment-agnostic — it spins up its own Postgres + Redis
  # service containers and runs Django tests. It runs once regardless of target env.
  test:
    name: Django tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reservation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          POSTGRES_DB: reservation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          DJANGO_SECRET_KEY: ci-only-do-not-reuse
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "*"
        run: python manage.py test --settings=config.test_settings --verbosity=2

  # Map git ref (or workflow_dispatch input) to a target environment name.
  # Downstream jobs consume this via `environment: ${{ needs.resolve.outputs.environment }}`
  # so per-env GitHub Variables (deploy role ARN, etc.) resolve correctly and the
  # OIDC sub claim matches `repo:OWNER/REPO:environment:<env>`.
  resolve:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      ecr_repository: ${{ steps.pick.outputs.ecr_repository }}
      ecs_cluster: ${{ steps.pick.outputs.ecs_cluster }}
      api_service: ${{ steps.pick.outputs.api_service }}
      worker_service: ${{ steps.pick.outputs.worker_service }}
      beat_service: ${{ steps.pick.outputs.beat_service }}
      tg_working_dir: ${{ steps.pick.outputs.tg_working_dir }}
      migrate_family: ${{ steps.pick.outputs.migrate_family }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            ENV="staging"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="prod"
          else
            echo "No environment mapping for ref ${{ github.ref }}" >&2
            exit 1
          fi

          # The Terragrunt directory + AWS resource names use the short env token
          # `stage` / `prod`. The GitHub Environment is `staging` / `prod`.
          case "$ENV" in
            staging) SHORT="stage" ;;
            prod)    SHORT="prod"  ;;
            *) echo "Unsupported env: $ENV" >&2; exit 1 ;;
          esac

          {
            echo "environment=$ENV"
            echo "ecr_repository=reservation/$SHORT/api"
            echo "ecs_cluster=ecs-reservation-$SHORT"
            echo "api_service=svc-ecs-reservation-$SHORT-api"
            echo "worker_service=svc-ecs-reservation-$SHORT-celery-worker"
            echo "beat_service=svc-ecs-reservation-$SHORT-celery-beat"
            echo "tg_working_dir=aws/accounts/$SHORT/ap-southeast-1/ecs"
            echo "migrate_family=migrate-reservation-$SHORT"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved environment=$ENV (short=$SHORT)"

  build:
    name: Build & push image (${{ needs.resolve.outputs.environment }})
    needs: [test, resolve]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}   # OIDC sub claim becomes ":environment:<env>"
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_SHA::12}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push
        if: github.event.inputs.image_tag == ''  # skip build if we're redeploying an existing image
        working-directory: backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ needs.resolve.outputs.ecr_repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker build --pull -t "$IMAGE" .
          docker tag "$IMAGE" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "Pushed $IMAGE"

      - name: Confirm rollback image exists
        if: github.event.inputs.image_tag != ''
        env:
          ECR_REPOSITORY: ${{ needs.resolve.outputs.ecr_repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" >/dev/null
          echo "Found existing image with tag $TAG — rollback proceeding."

  migrate:
    name: Run Django migrations (${{ needs.resolve.outputs.environment }})
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register & run migrate task
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          ECR_REPOSITORY: ${{ needs.resolve.outputs.ecr_repository }}
          ECS_CLUSTER: ${{ needs.resolve.outputs.ecs_cluster }}
          API_SERVICE: ${{ needs.resolve.outputs.api_service }}
          MIGRATE_FAMILY: ${{ needs.resolve.outputs.migrate_family }}
        run: |
          set -euo pipefail

          # 1. Clone the API service's current task definition as a template.
          CURRENT_TD_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$API_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          echo "Cloning task def: $CURRENT_TD_ARN"

          aws ecs describe-task-definition --task-definition "$CURRENT_TD_ARN" \
            --query 'taskDefinition' --output json > td.json

          # 2. Build the migrate task def: same env/secrets/roles, swap image + command.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          NEW_IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"
          API_CONTAINER_NAME=$(jq -r '.containerDefinitions[0].name' td.json)

          jq --arg image "$NEW_IMAGE" --arg name "$API_CONTAINER_NAME" --arg family "$MIGRATE_FAMILY" '
            .family = $family |
            .containerDefinitions = [
              (.containerDefinitions[] | select(.name == $name) | .image = $image
                | .command = ["sh","-c","python manage.py migrate --noinput && python manage.py seed_categories"]
                | del(.entryPoint)
                | .portMappings = [])
            ] |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' td.json > migrate-td.json

          MIGRATE_TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://migrate-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered: $MIGRATE_TD_ARN"

          # 3. Use the API service's network config so the task lands in the same subnets/SGs.
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$API_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATE_TD_ARN" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --started-by "gha-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Started: $TASK_ARN"

          # 4. Wait, then assert success.
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration task failed with exit code $EXIT_CODE"
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text
            TASK_ID="${TASK_ARN##*/}"
            LOG_PREFIX=$(jq -r '.containerDefinitions[0].logConfiguration.options["awslogs-stream-prefix"] // empty' td.json)
            LOG_GROUP=$(jq -r '.containerDefinitions[0].logConfiguration.options["awslogs-group"] // empty' td.json)
            if [ -n "$LOG_GROUP" ]; then
              echo "Last 50 log lines:"
              aws logs tail "$LOG_GROUP" --since 10m --filter-pattern "$TASK_ID" | tail -50 || true
            fi
            exit 1
          fi
          echo "Migrations completed successfully."

  deploy:
    name: Roll out ECS services (${{ needs.resolve.outputs.environment }})
    needs: [resolve, build, migrate]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    # Queue concurrent deploys to the same env; allow different envs to run in parallel.
    concurrency:
      group: backend-deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt apply (ecs layer)
        working-directory: ${{ needs.resolve.outputs.tg_working_dir }}
        env:
          API_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt apply -auto-approve

      - name: Wait for services to stabilize
        env:
          ECS_CLUSTER: ${{ needs.resolve.outputs.ecs_cluster }}
          API_SERVICE: ${{ needs.resolve.outputs.api_service }}
          WORKER_SERVICE: ${{ needs.resolve.outputs.worker_service }}
          BEAT_SERVICE: ${{ needs.resolve.outputs.beat_service }}
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$API_SERVICE" "$WORKER_SERVICE" "$BEAT_SERVICE"
          echo "All ECS services are stable on tag ${{ needs.build.outputs.image_tag }}"

      - name: Summary
        env:
          ECS_CLUSTER: ${{ needs.resolve.outputs.ecs_cluster }}
        run: |
          {
            echo "### Deploy summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | \`${{ needs.resolve.outputs.environment }}\` |"
            echo "| Image tag | \`${{ needs.build.outputs.image_tag }}\` |"
            echo "| Commit | [${GITHUB_SHA::12}](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |"
            echo "| Cluster | $ECS_CLUSTER |"
            echo "| Region | $AWS_REGION |"
          } >> "$GITHUB_STEP_SUMMARY"
