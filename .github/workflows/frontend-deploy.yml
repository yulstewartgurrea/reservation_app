name: Frontend deploy

# Branch → environment mapping:
#   staging → staging
#   main    → prod
on:
  push:
    branches: [staging, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Force deploy to a specific environment"
        required: true
        type: choice
        options: [staging, prod]

permissions:
  id-token: write   # required for AWS OIDC token exchange
  contents: read

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "No environment mapping for ref ${{ github.ref }}" >&2
            exit 1
          fi

  deploy:
    name: Build & deploy (${{ needs.resolve.outputs.environment }})
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}   # GitHub Environments — set per-env variables here
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (static export)
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::warning::NEXT_PUBLIC_API_URL is empty — frontend will not be able to reach the backend"
          fi
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Sync to S3
        env:
          # Trim accidental whitespace/newlines on these env vars — GitHub's UI sometimes
          # preserves trailing newlines on paste, which makes the AWS CLI reject the value.
          BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          BUCKET="$(echo -n "$BUCKET" | tr -d '[:space:]')"
          # Hashed assets in /_next/ are immutable — long cache.
          aws s3 sync out/_next/ "s3://$BUCKET/_next/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          # HTML and everything else — short cache, since URLs aren't fingerprinted.
          aws s3 sync out/ "s3://$BUCKET/" \
            --delete \
            --exclude "_next/*" \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          DISTRIBUTION_ID="$(echo -n "$DISTRIBUTION_ID" | tr -d '[:space:]')"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
