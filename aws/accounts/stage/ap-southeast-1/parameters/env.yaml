# Reservation app — stage environment values.
#
# These are merged at apply-time and uploaded to SSM Parameter Store under:
#   /reservation/stage/<KEY>
#
# Values under `secret_parameters` are stored as SecureString (KMS-encrypted at rest).
# Values under `ssm_parameters` are stored as plain String.
#
# Fill in real values BEFORE the first apply, or leave placeholders and update
# the SSM parameters directly in the AWS console / via `aws ssm put-parameter`
# afterwards. (Initial apply will accept the placeholders below.)

secret_parameters:
  DJANGO_SECRET_KEY: "REPLACE-ME-generate-a-50-char-random-string"
  PAYMONGO_SECRET_KEY: ""
  PAYMONGO_PUBLIC_KEY: ""
  PAYMONGO_WEBHOOK_SECRET: ""
  # EMAIL_HOST_PASSWORD is owned by the ses layer at /reservation/stage/ses/smtp_password.

  # Resend (only read when EMAIL_BACKEND is flipped to the anymail Resend backend
  # — see the email switch note below). Created as SecureString placeholders;
  # set the real values via `aws ssm put-parameter --overwrite` after first apply.
  RESEND_API_KEY: ""
  RESEND_SIGNING_SECRET: ""

ssm_parameters:
  # Django
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"
  # Same-origin via CloudFront /api/* — CORS shouldn't be exercised in practice,
  # but list both the custom domain and the raw CloudFront host so probes/tools
  # and the pre-DNS-cutover URL keep working.
  CORS_ALLOWED_ORIGINS: "https://staging.bookme.ph,https://dx1epgde94eqq.cloudfront.net"
  # Drives absolute links in transactional emails. Switch to the custom domain.
  FRONTEND_URL: "https://staging.bookme.ph"

  # Business rules (see app_ideas.md §8)
  DEFAULT_COMMISSION_RATE: "0.10"
  DEFAULT_CANCELLATION_WINDOW_HOURS: "24"
  STRIKE_LIMIT: "3"
  STRIKE_WINDOW_DAYS: "90"

  # Media uploads — when set, Django uses S3Storage with presigned URLs
  # instead of the (ephemeral) local filesystem. Bucket is provisioned by
  # the s3 layer (`bucket_names_private` in region.hcl).
  AWS_STORAGE_BUCKET_NAME: "s3-reservation-stage-media"

  # Email — all EMAIL_* keys are now created and populated by the ses layer
  # under /reservation/stage/ses/*. The ecs task definition reads them from
  # there (see region.hcl). If you revert to a non-SES provider, restore
  # these keys here and re-point the ecs task secrets.
  #
  # SWITCHING TO RESEND (no Terraform/task-def change — the RESEND_* secrets are
  # already wired into the ecs task via region.hcl). EMAIL_BACKEND/DEFAULT_FROM_EMAIL
  # live under /reservation/stage/ses/*, so flip them in place, then restart the
  # ECS service (force-new-deployment) so tasks pick up the new values:
  #   aws ssm put-parameter --overwrite --name /reservation/stage/ses/email_backend \
  #       --type String --value anymail.backends.resend.EmailBackend
  #   aws ssm put-parameter --overwrite --name /reservation/stage/ses/default_from_email \
  #       --type String --value 'BookMe <noreply@bookme.ph>'
  # Revert by setting email_backend back to django.core.mail.backends.smtp.EmailBackend.
