# Reservation app — stage environment values.
#
# These are merged at apply-time and uploaded to SSM Parameter Store under:
#   /reservation/stage/<KEY>
#
# Values under `secret_parameters` are stored as SecureString (KMS-encrypted at rest).
# Values under `ssm_parameters` are stored as plain String.
#
# Fill in real values BEFORE the first apply, or leave placeholders and update
# the SSM parameters directly in the AWS console / via `aws ssm put-parameter`
# afterwards. (Initial apply will accept the placeholders below.)

secret_parameters:
  DJANGO_SECRET_KEY: "REPLACE-ME-generate-a-50-char-random-string"
  PAYMONGO_SECRET_KEY: ""
  PAYMONGO_PUBLIC_KEY: ""
  PAYMONGO_WEBHOOK_SECRET: ""
  EMAIL_HOST_PASSWORD: ""

ssm_parameters:
  # Django
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "https://stage.example.com"

  # Business rules (see app_ideas.md §8)
  DEFAULT_COMMISSION_RATE: "0.10"
  DEFAULT_CANCELLATION_WINDOW_HOURS: "24"
  STRIKE_LIMIT: "3"
  STRIKE_WINDOW_DAYS: "90"

  # Email (switch backend when you wire up SES/SendGrid)
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
  EMAIL_HOST: ""
  EMAIL_PORT: "587"
  EMAIL_HOST_USER: ""
  EMAIL_USE_TLS: "True"
  DEFAULT_FROM_EMAIL: "Reserva <noreply@reserva.example.com>"
