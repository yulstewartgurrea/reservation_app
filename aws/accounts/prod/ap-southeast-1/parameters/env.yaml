# Reservation app — prod environment values.
#
# These are merged at apply-time and uploaded to SSM Parameter Store under:
#   /reservation/prod/<KEY>
#
# Values under `secret_parameters` are stored as SecureString (KMS-encrypted at rest).
# Values under `ssm_parameters` are stored as plain String.
#
# After the first apply, Terraform stops managing each parameter's `value`
# (see `lifecycle.ignore_changes` in layers/parameters/main.tf). So:
#   - Leave placeholders here; update via `aws ssm put-parameter` after the
#     first apply — that's the canonical workflow.
#   - Real secrets MUST NOT be committed to this repo.

secret_parameters:
  # TODO: generate with:
  #   python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
  # then paste here for the first apply, or leave this placeholder and overwrite
  # via `aws ssm put-parameter` once SSM exists.
  DJANGO_SECRET_KEY: "REPLACE-ME-generate-a-50-char-random-string"

  # TODO: paste real prod keys before applying parameters layer.
  # Until these are filled in, the dev-fake checkout path stays active
  # (apps/payments/paymongo.py returns a fake checkout URL when the secret is
  # empty) — useful for first-deploy smoke tests but NOT acceptable for real
  # customers. Fill these in (live, not test, keys) before flipping prod live.
  PAYMONGO_SECRET_KEY: ""
  PAYMONGO_PUBLIC_KEY: ""
  PAYMONGO_WEBHOOK_SECRET: ""
  # EMAIL_HOST_PASSWORD is owned by the ses layer at /reservation/prod/ses/smtp_password.

  # Resend (only read when EMAIL_BACKEND is flipped to the anymail Resend backend).
  # Created as SecureString placeholders; set the real values via
  # `aws ssm put-parameter --overwrite` after first apply. Never commit real keys.
  RESEND_API_KEY: ""
  RESEND_SIGNING_SECRET: ""

ssm_parameters:
  # Django
  DJANGO_DEBUG: "False"
  # Restrictive: CloudFront forwards the viewer Host (AllViewer origin request
  # policy), so real traffic arrives as bookme.ph / www.bookme.ph. The ALB health
  # probe (raw task IP) is handled by apps.core.middleware.HealthCheckMiddleware,
  # which answers /health/ before host validation — so a restrictive list is safe
  # and the deployment still stabilizes. (Set out-of-band too; ignore_changes.)
  DJANGO_ALLOWED_HOSTS: "bookme.ph,www.bookme.ph"
  # Same-origin via CloudFront /api/* — CORS shouldn't be exercised in practice,
  # but list both apex and www so probes/tools work consistently.
  CORS_ALLOWED_ORIGINS: "https://bookme.ph,https://www.bookme.ph"
  # Drives absolute links in transactional emails. Apex (no www) for cleaner
  # canonical URLs.
  FRONTEND_URL: "https://bookme.ph"

  # Business rules (see app_ideas.md §8) — same defaults as stage.
  DEFAULT_COMMISSION_RATE: "0.10"
  DEFAULT_CANCELLATION_WINDOW_HOURS: "24"
  STRIKE_LIMIT: "3"
  STRIKE_WINDOW_DAYS: "90"

  # Media uploads — Django reads this at startup and switches to S3Storage
  # with presigned URLs. Bucket is provisioned by the storage layer
  # (`bucket_names_private` in region.hcl).
  AWS_STORAGE_BUCKET_NAME: "s3-reservation-prod-media"

  # Email — all EMAIL_* keys are created and populated by the ses layer
  # under /reservation/prod/ses/*. The ecs task definition reads them from
  # there (see region.hcl). If you revert to a non-SES provider, restore
  # these keys here and re-point the ecs task secrets.
