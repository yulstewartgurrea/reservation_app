<!doctype html>
<html>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 560px; margin: 0 auto; color: #0f172a;">
    <h2 style="color: #4338ca;">Verify your email</h2>
    <p>Hi {{ user.first_name|default:user.username }},</p>
    <p>Please confirm your email so we can send you booking confirmations and reminders.</p>
    <p>
      <a href="{{ link }}" style="background: #4f46e5; color: #fff; padding: 10px 16px; text-decoration: none; border-radius: 6px; display: inline-block;">
        Verify email
      </a>
    </p>
    <p style="color: #94a3b8; font-size: 12px;">Link valid for 3 days. If you didn't create an account, ignore this email.</p>
  </body>
</html>
