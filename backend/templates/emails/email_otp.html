<!doctype html>
<html>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 560px; margin: 0 auto; color: #0f172a;">
    <h2 style="color: #4338ca;">Your verification code</h2>
    <p>Hi {{ user.first_name|default:user.username }},</p>
    <p>Enter this 6-digit code to verify your Reserva email:</p>
    <p style="font-size: 32px; font-weight: 700; letter-spacing: 8px; background: #f1f5f9; padding: 16px 24px; border-radius: 8px; display: inline-block; color: #0f172a;">
      {{ code }}
    </p>
    <p style="color: #94a3b8; font-size: 12px;">Code expires in 10 minutes. If you didn't sign up, you can ignore this email.</p>
  </body>
</html>
