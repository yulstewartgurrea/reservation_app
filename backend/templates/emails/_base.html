{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <title>{% block title %}BookMe{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#0f172a;-webkit-font-smoothing:antialiased;">
    <span style="display:none!important;visibility:hidden;mso-hide:all;font-size:1px;color:#f1f5f9;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{% block preheader %}{% endblock %}</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f1f5f9;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="max-width:560px;width:100%;background:#ffffff;border-radius:20px;box-shadow:0 6px 24px rgba(15,23,42,0.06);border:1px solid #e2e8f0;overflow:hidden;">
            <!-- HEADER -->
            <tr>
              <td style="padding:36px 40px 8px 40px;text-align:center;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                  <tr>
                    <td style="background:#4f46e5;border-radius:9px;width:32px;height:32px;text-align:center;vertical-align:middle;color:#ffffff;font-size:17px;font-weight:700;line-height:32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">B</td>
                    <td style="padding-left:10px;font-size:22px;font-weight:700;color:#4f46e5;letter-spacing:-0.01em;vertical-align:middle;line-height:32px;">BookMe</td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- BODY -->
            <tr>
              <td style="padding:24px 40px 40px 40px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <!-- FOOTER -->
            <tr>
              <td style="border-top:1px solid #e2e8f0;padding:18px 40px;text-align:center;font-size:12px;color:#94a3b8;line-height:1.6;">
                BookMe &middot; Book local services in seconds
              </td>
            </tr>
          </table>
          <!-- Outside-card legal line -->
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="max-width:560px;width:100%;">
            <tr>
              <td style="padding:16px 8px 0 8px;text-align:center;font-size:11px;color:#94a3b8;line-height:1.6;">
                You&rsquo;re receiving this email because of activity on your BookMe account.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
